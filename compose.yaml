name: warp-socks

services:
  warp-socks:
    build:
      context: .
    # 显式指定镜像名，避免 Compose 默认生成 warp-socks-warp-socks 这种重复名称。
    image: warp-socks:${IMAGE_TAG:-dev}
    container_name: warp-socks
    restart: ${RESTART_POLICY:-unless-stopped}
    mem_limit: 256m
    cpus: 0.50
    # 不设置时容器继承 Docker daemon 的默认值，部分环境下这个默认值偏低；
    # 并发代理连接一多（每条 SOCKS5/SOCKS4/HTTP 代理连接各占用宿主机侧一个
    # 真实 fd）就可能撞到上限，触发 accept() 返回 EMFILE。显式调大更贴近这个
    # 代理实际的并发连接规模。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      # WireGuard 首次注册只接受注册链接 token= 后面的原始三段 JWT；不要包含
      # token=、完整 com.cloudflare.warp:// 链接或引号。纯 MASQUE 场景可留空；
      # 已有 ./data/account.json 后重启也可以留空。详见 README。
      TEAMS_TOKEN: ${TEAMS_TOKEN:-}
      # auto 自动监听 IPv4/IPv6，只允许 LAN 客户端；UDP relay 自动跟随
      # 控制连接实际使用的本机地址和地址族。
      SOCKS_LISTEN_ADDRS: ${SOCKS_LISTEN_ADDRS:-auto}
      SOCKS_LISTEN_PORT: ${SOCKS_LISTEN_PORT:-1080}
      ENDPOINT_CANDIDATES: ${ENDPOINT_CANDIDATES:-}
      # 默认优先走 MASQUE 隧道（缺 reg.json 会自动注册，不需要 TEAMS_TOKEN），失败仍回退 WireGuard；显式设为 0 可强制只用 WireGuard。
      WARP_SOCKS_ENABLE_MASQUE: ${WARP_SOCKS_ENABLE_MASQUE:-1}
      # 日志级别改用 Rust 标准的 RUST_LOG（env_logger），默认 info；调试可设 RUST_LOG=debug。
      RUST_LOG: ${RUST_LOG:-info}
      WARP_SOCKS_REGISTER_RETRIES: ${WARP_SOCKS_REGISTER_RETRIES:-2}
      WARP_SOCKS_REGISTER_RETRY_DELAY: ${WARP_SOCKS_REGISTER_RETRY_DELAY:-2}
      WARP_SOCKS_STARTUP_EGRESS_PROBE_DELAY: ${WARP_SOCKS_STARTUP_EGRESS_PROBE_DELAY:-1}
      WARP_SOCKS_STARTUP_EGRESS_PROBE_TIMEOUT: ${WARP_SOCKS_STARTUP_EGRESS_PROBE_TIMEOUT:-5}
      WARP_SOCKS_STARTUP_SOCKS_READY_TIMEOUT: ${WARP_SOCKS_STARTUP_SOCKS_READY_TIMEOUT:-20}
      # 留空时由应用使用运维层默认探测预算；需要覆盖时再显式配置秒数。
      WARP_SOCKS_HEALTHCHECK_PROBE_TIMEOUT: ${WARP_SOCKS_HEALTHCHECK_PROBE_TIMEOUT:-}
      WARP_SOCKS_HEALTHCHECK_FAILURE_THRESHOLD: ${WARP_SOCKS_HEALTHCHECK_FAILURE_THRESHOLD:-3}
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '1'
    # UDP ASSOCIATE 使用随机 relay 端口，bridge/ports 无法预先发布；host
    # network 让返回的 BND.ADDR:BND.PORT 对远端客户端真实可达。
    network_mode: host
    volumes:
      # 把 WireGuard 与 MASQUE 的注册结果、隧道配置都落到当前目录，便于查看和备份。
      # 目录名统一叫 data（宿主机 ./data、容器内 /etc/warp-socks），不再用
      # wireguard 这种偏向单一后端的名字——这里同时存了 wg0.conf/account.json
      # 和 MASQUE 的 reg.json。老版本用过 ./wireguard 的部署，把这个目录整个
      # 改名成 data（或调整这行左侧路径）即可继续复用已有状态。
      - ./data:/etc/warp-socks
