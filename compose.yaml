name: warp-socks

services:
  warp-socks:
    build:
      context: .
    # 显式指定镜像名，避免 Compose 默认生成 warp-socks-warp-socks 这种重复名称。
    image: warp-socks:latest
    container_name: warp-socks
    restart: ${RESTART_POLICY:-unless-stopped}
    mem_limit: 256m
    cpus: 0.50
    environment:
      # 首次启动必须提供；已经在 ./wireguard 下留有 account.json 后，重启可以留空。详见 README。
      TEAMS_TOKEN: ${TEAMS_TOKEN:-}
      # 仅用于容器启动日志，帮助区分"宿主机入口"与"容器内监听"。
      HOST_BIND_IP: ${HOST_BIND_IP:-127.0.0.1}
      HOST_BIND_PORT: ${HOST_BIND_PORT:-1080}
      ENDPOINT_CANDIDATES: ${ENDPOINT_CANDIDATES:-}
      # 开启后优先走 MASQUE 隧道（缺 reg.json 会自动注册），失败仍回退 WireGuard。
      WARP_SOCKS_ENABLE_MASQUE: ${WARP_SOCKS_ENABLE_MASQUE:-0}
      # 日志级别改用 Rust 标准的 RUST_LOG（env_logger），默认 info；调试可设 RUST_LOG=debug。
      RUST_LOG: ${RUST_LOG:-info}
      WARP_SOCKS_REGISTER_RETRIES: ${WARP_SOCKS_REGISTER_RETRIES:-2}
      WARP_SOCKS_REGISTER_RETRY_DELAY: ${WARP_SOCKS_REGISTER_RETRY_DELAY:-2}
      WARP_SOCKS_STARTUP_EGRESS_PROBE_DELAY: ${WARP_SOCKS_STARTUP_EGRESS_PROBE_DELAY:-1}
      WARP_SOCKS_STARTUP_EGRESS_PROBE_TIMEOUT: ${WARP_SOCKS_STARTUP_EGRESS_PROBE_TIMEOUT:-5}
      WARP_SOCKS_STARTUP_SOCKS_READY_TIMEOUT: ${WARP_SOCKS_STARTUP_SOCKS_READY_TIMEOUT:-20}
      # 故意不写字面默认值：compose 的 ${VAR:-N} 语法只要 N 非空，就会把 N
      # 实实在在写成容器环境变量，而不是"不设置"——真正的派生链
      # （masque::CONNECT_STREAM_TIMEOUT → relay::CONNECT_TIMEOUT → 这个字段
      # 的默认值）只活在 appconfig.rs 里，这里如果镜像抄一份具体数字，链路
      # 任何一层超时改动后就会跟这里的硬编码值悄悄漂移。留空时容器里这个
      # 变量是空字符串，appconfig.rs::sanitize_positive_int 解析失败会自动
      # 退回它自己算出来的默认值，链路永远只有一个源头。
      WARP_SOCKS_HEALTHCHECK_PROBE_TIMEOUT: ${WARP_SOCKS_HEALTHCHECK_PROBE_TIMEOUT:-}
      WARP_SOCKS_HEALTHCHECK_FAILURE_THRESHOLD: ${WARP_SOCKS_HEALTHCHECK_FAILURE_THRESHOLD:-3}
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '1'
    ports:
      # 默认只绑定到本机，先确保代理可用；需要对外暴露时再改 HOST_BIND_IP=0.0.0.0
      - '${HOST_BIND_IP:-127.0.0.1}:${HOST_BIND_PORT:-1080}:1080'
    volumes:
      # 把注册结果和 WireGuard 配置直接落到当前目录，便于查看和备份。
      - ./wireguard:/etc/wireguard
