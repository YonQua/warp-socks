[package]
name = "warp-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "handshake_probe"
path = "src/bin/handshake_probe.rs"

[[bin]]
name = "warp-socks"
path = "src/bin/warp-socks.rs"

[dependencies]
# NordSecurity v1.2.9（crate version 0.6.0）包含 crates.io boringtun 0.7.1
# 尚未合入的 keepalive/rekey 计时修正；固定 tag 对应提交，避免依赖漂移。
boringtun = {
    git = "https://github.com/NordSecurity/boringtun",
    rev = "c2aeb269d92ba0834d72cf69d63afe572340d4d1",
}
base64 = "0.22"
rand = "0.8"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "time", "sync"] }
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "async", "socket-tcp", "socket-udp", "medium-ip", "proto-ipv4", "proto-ipv6"] }
parking_lot = "0.12"
socket2 = "0.6"
futures = "0.3"
httparse = "1"
quinn = "0.11"
quinn-proto = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"

# MASQUE 客户端身份与传输
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rcgen = "0.13"
time = "0.3"
x509-parser = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
# H2、隧道内 HTTPS / DoH 使用 TLS；标准站点验证公开 CA，边缘验证固定公钥。
# 关掉 tokio-rustls 默认的 aws_lc_rs 后端，全项目统一用 ring（同 tls.rs）。
tokio-rustls = { version = "0.26", default-features = false }
h2 = "0.4"
http = "1"
bytes = "1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
webpki-roots = "1"
makiko = "=0.2.5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = { version = "0.10", features = ["oid"] }
hex = "0.4"

[dev-dependencies]
tempfile = "3"
