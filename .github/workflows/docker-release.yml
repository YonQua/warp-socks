name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  # 固定 cross 的 git commit（而非跟随 --git 浮动 HEAD）：既保证可复现（不会因为
  # 上游几个月后的一次提交突然让某个 target 编译失败或行为变化），又能给
  # actions/cache 一个稳定的 key。这个 commit 就是本仓库第一次三平台全绿的
  # run（30604317623）里 cargo install 实际解析到的版本，已验证支持我们要的
  # 三个 musl target；以后要跟进上游新版本时手动改这个值即可。
  CROSS_REV: 1d07d3f9cc465c435256f1aabc1d18024517891a

jobs:
  prepare:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.meta.outputs.skip }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
      major_minor: ${{ steps.meta.outputs.major_minor }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags origin

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          skip=false

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            existing_tag="$(git tag --points-at "${GITHUB_SHA}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' | head -n1 || true)"
            if [[ -n "${existing_tag}" ]]; then
              skip=true
              release_tag="${existing_tag}"
            else
              latest_tag="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
              if [[ -z "${latest_tag}" ]]; then
                release_tag="v0.1.0"
              else
                version="${latest_tag#v}"
                IFS='.' read -r major minor patch <<< "${version}"
                release_tag="v${major}.${minor}.$((patch + 1))"
              fi
            fi
          fi

          version="${release_tag#v}"
          IFS='.' read -r major minor _ <<< "${version}"
          major_minor="${major}.${minor}"
          prerelease=false
          if [[ "${release_tag}" == *-* ]]; then
            prerelease=true
          fi

          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${major_minor}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

  cross-build:
    name: Cross-compile (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            target: aarch64-unknown-linux-musl
          - platform: linux/arm/v7
            target: armv7-unknown-linux-musleabihf
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cross 本身很少变，命中率高；key 固定在 CROSS_REV 上，只有手动改这个
      # 值时才会重新从源码编译（几十秒到 1-2 分钟），平时都是直接下载缓存。
      - name: Cache cross tool
        id: cache-cross
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cross
            ~/.cargo/bin/cross-util
          key: cross-bin-${{ runner.os }}-${{ env.CROSS_REV }}

      - name: Install cross
        if: steps.cache-cross.outputs.cache-hit != 'true'
        run: cargo install cross --git https://github.com/cross-rs/cross --rev ${{ env.CROSS_REV }} --locked

      # cross 把宿主机 ~/.cargo 和 target/<target> 挂进容器里跑 cargo build（详见
      # CLAUDE.md 里 cross 机制说明），所以这两个目录会落在 runner 本机文件系统上，
      # 可以直接缓存；key 按 Cargo.lock 哈希失效，避免依赖升级后还复用旧编译产物。
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}
          key: cross-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cross-build-${{ matrix.target }}-

      - name: Cross-compile release binary
        run: cross build --release --target ${{ matrix.target }} --bin warp-socks

      - name: Stage binary
        shell: bash
        run: |
          set -eu
          mkdir -p "dist/${{ matrix.platform }}"
          install -m 0755 "target/${{ matrix.target }}/release/warp-socks" "dist/${{ matrix.platform }}/warp-socks-rs"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/${{ matrix.platform }}/warp-socks-rs
          retention-days: 1

  publish:
    name: Publish Image And GitHub Release
    needs: [prepare, cross-build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download cross-compiled binaries
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts

      # 三个 matrix job 各自只产出自己 target 的单个文件（artifacts/dist-<target>/
      # warp-socks-rs），这里按 platform<->target 映射还原成 Dockerfile.release
      # 期望的 dist/<platform>/warp-socks-rs 目录结构。映射关系必须和上面
      # cross-build 的 matrix 保持一致。
      - name: Assemble dist/ layout
        shell: bash
        run: |
          set -eu
          for pair in \
            "linux/amd64:x86_64-unknown-linux-musl" \
            "linux/arm64:aarch64-unknown-linux-musl" \
            "linux/arm/v7:armv7-unknown-linux-musleabihf"; do
            platform="${pair%%:*}"
            target="${pair#*:}"
            mkdir -p "dist/${platform}"
            install -m 0755 "artifacts/dist-${target}/warp-socks-rs" "dist/${platform}/warp-socks-rs"
          done

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.release_tag }}
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major_minor }},enable=${{ needs.prepare.outputs.prerelease != 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease != 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          prerelease_flag=()
          release_tag="${{ needs.prepare.outputs.release_tag }}"
          if [[ "${{ needs.prepare.outputs.prerelease }}" == "true" ]]; then
            prerelease_flag+=(--prerelease)
          fi

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release ${release_tag} already exists; skipping creation."
            exit 0
          fi

          gh release create "${release_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${release_tag}" \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            "${prerelease_flag[@]}"
