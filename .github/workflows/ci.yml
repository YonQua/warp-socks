name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    name: warp-rs fmt/clippy/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warp-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            warp-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('warp-rs/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck --severity=warning entrypoint.sh healthcheck/check-socks5.sh lib/*.sh lib/*/*.sh
